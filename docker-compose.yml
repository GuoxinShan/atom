# ATOM Desk only. Laya stays in its own stack on the Mac
# (`~/dev/laya-docker` → http://127.0.0.1:8790). Do not add a Laya service here.
#
# Manual start — this file does not use restart: always / unless-stopped,
# which would bring Desk back when Docker Desktop launches at login.
# No LaunchAgent / login item. No host sidecar for yzj-cli.
# Progress-scan stays on the Mac: scripts/desk-up.sh starts compose plus
# `pnpm atom progress-scan --loop`, which writes data/progress-snapshot.json
# into this ./data mount. `docker compose up -d` alone still serves Desk;
# without the helper, cron fail-opens and keeps the last snapshot.
#
#   pnpm desk                     # compose + host progress-scan helper
#   docker compose up -d          # Desk only (snapshot must already exist)
#   docker compose down           # stop (named volumes keep yzj/grok login)
#   docker compose logs -f desk   # follow serve + poll-yzj-15m ticks
#   docker compose exec desk yzj-cli auth login --device
services:
  desk:
    build: .
    ports:
      - "8787:8787"
    environment:
      ATOM_WEB_HOST: "0.0.0.0"
      ATOM_WEB_PORT: "8787"
      # Mac Docker Desktop: host.docker.internal → the Mac, where Laya listens.
      LAYA_URL: "${LAYA_URL:-http://host.docker.internal:8790}"
      LAYA_ENABLED: "${LAYA_ENABLED:-}"
      TZ: Asia/Shanghai
      # yzj-cli 0.1.6: config ~/.yzj-cli ; Linux encrypted keychain under data dir.
      YZJ_CLI_CONFIG_DIR: /root/.yzj-cli
      YZJ_CLI_DATA_DIR: /root/.local/share/yzj-cli
      # Optional: skip grok spawn when not logged in. Default uses in-image grok.
      ATOM_EXTRACT_AGENT: "${ATOM_EXTRACT_AGENT:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      # Refresh progress-snapshot.json on each 15m tick. Git stays on the Mac;
      # cron writes data/progress-scan.request.json and waits for the helper.
      # Scan failure is fail-open (last snapshot + poll/extract continue).
      ATOM_PROGRESS_SCAN: "${ATOM_PROGRESS_SCAN:-}"
      ATOM_PROGRESS_SCAN_WAIT_MS: "${ATOM_PROGRESS_SCAN_WAIT_MS:-45000}"
      ATOM_PROGRESS_SCAN_URL: "${ATOM_PROGRESS_SCAN_URL:-}"
      ATOM_PROGRESS_SCAN_HOOK: "${ATOM_PROGRESS_SCAN_HOOK:-}"
    extra_hosts:
      # Linux Docker Engine: same hostname as Desktop. HTTP to Laya only —
      # does not put host Mac binaries on PATH (and must not; wrong ABI).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./out:/app/out
      # Persist device-code login across `compose down` / recreate. Tokens are
      # not in the image or git. `compose down -v` wipes them.
      - yzj-cli-config:/root/.yzj-cli
      - yzj-cli-data:/root/.local/share/yzj-cli
      - grok-home:/root/.grok
      # Done gate: do NOT rely on host git inside the image. Each 15m tick
      # writes data/progress-scan.request.json; the Mac helper
      # (`pnpm atom progress-scan --loop`, started by scripts/desk-up.sh)
      # scans atom/yzj/ai-advance and writes data/progress-snapshot.json
      # which this ./data mount already exposes. Optional read-only repo mounts
      # (same paths as data/workspaces.json) only help if you also install git
      # in the image — not the dogfood path:
      # - /Users/kingdee/dev/personal/atom:/Users/kingdee/dev/personal/atom:ro
      # - /Users/kingdee/dev/yzj:/Users/kingdee/dev/yzj:ro
      # - /Users/kingdee/dev/ai-advance:/Users/kingdee/dev/ai-advance:ro
    restart: "no"
    init: true

volumes:
  yzj-cli-config:
  yzj-cli-data:
  grok-home:
